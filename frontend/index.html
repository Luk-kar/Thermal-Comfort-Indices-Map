<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Output PNG preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #app { display: flex; height: 100%; }
    #sidebar { width: 300px; padding: 12px; overflow-y: auto; border-right: 1px solid #ccc; box-sizing: border-box; }
    #map { flex: 1; }
    #files { list-style: none; padding: 0; margin: 8px 0; }
    #files li { padding: 6px 8px; cursor: pointer; border-radius: 4px; word-break: break-all; font-size: 13px; }
    #files li:hover { background: #eee; }
    #files li.active { background: #cfe3ff; }
    label { display: block; margin-top: 12px; font-size: 13px; }
    input[type=range] { width: 100%; }
    .point-data { max-height: 65vh; overflow-y: auto; padding-right: 4px; }
    .point-data h3 { margin: 0 0 8px; }
    .point-data p { margin: 6px 0; }
    .point-data table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .point-data th, .point-data td { padding: 6px; border-bottom: 1px solid #ddd; text-align: left; }
    .point-data td:last-child { white-space: nowrap; text-align: right; }
    .point-data .band-name { display: block; font-size: 10px; color: #666; overflow-wrap: anywhere; }
    .point-data .point-note { font-size: 11px; color: #555; }
    #status { font-size: 12px; color: #a00; margin-top: 8px; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h3>PNG files in <code>output/</code></h3>
    <ul id="files"></ul>
    <label>Opacity: <span id="opacityVal">0.8</span>
      <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.8" />
    </label>
    <label><input id="fit" type="checkbox" checked /> Fit map to image on select</label>
    <p style="font-size:12px">Click the map to inspect all summary GeoTIFF bands.</p>
    <div id="status"></div>
  </div>
  <div id="map"></div>
</div>

<script src="./index.js"></script>
</body>
</html>
